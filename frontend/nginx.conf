# =============================================================================
# TheCreditWhisperers - Frontend nginx Configuration
# =============================================================================
# Production-ready nginx config for React SPA with backend API proxying
#
# Features:
# - Serves React static files with optimized caching
# - Proxies /api/* requests to backend service
# - Proxies /ws/* WebSocket connections to backend
# - Supports React Router (serves index.html for all routes)
# - Health check endpoint for container orchestration
# - Security headers and gzip compression

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/rss+xml application/atom+xml image/svg+xml;

    # Backend upstream (for Docker Compose networking)
    # The 'backend' hostname is resolved via Docker's internal DNS
    upstream backend_api {
        server backend:8000;
        keepalive 32;
    }

    # Notification service upstream (dedicated microservice for notifications)
    upstream notification_api {
        server notification:8001;
        keepalive 32;
    }

    # Market Data service upstream (stock prices, company info)
    upstream market_data_api {
        server market-data:8002;
        keepalive 32;
    }

    # Sentiment service upstream (news, sentiment analysis)
    upstream sentiment_api {
        server sentiment-service:8003;
        keepalive 32;
    }

    # Portfolio service upstream (portfolio aggregation, timeseries)
    upstream portfolio_api {
        server portfolio-service:8004;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # =====================================================================
        # Health Check Endpoint (for Kubernetes/Docker)
        # =====================================================================
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # =====================================================================
        # Notification API Proxy - Forward /api/notifications/* to Notification Service
        # =====================================================================
        # This must come BEFORE the general /api/ block (nginx matches first location)
        location /api/notifications {
            proxy_pass http://notification_api/api/notifications;
            proxy_http_version 1.1;

            # Headers for proper proxying
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # =====================================================================
        # Price Alerts API Proxy - Forward /api/price-alerts/* to Notification Service
        # =====================================================================
        location /api/price-alerts {
            proxy_pass http://notification_api/api/price-alerts;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # =====================================================================
        # Market Data API Proxy - Forward /api/market/* to Market Data Service
        # =====================================================================
        location /api/market {
            proxy_pass http://market_data_api/api/market;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # =====================================================================
        # Sentiment API Proxy - Forward /api/sentiment/* to Sentiment Service
        # =====================================================================
        location /api/sentiment {
            proxy_pass http://sentiment_api/api/sentiment;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # =====================================================================
        # Portfolio API Proxy - Forward /api/portfolio/* to Portfolio Service
        # =====================================================================
        location /api/portfolio {
            proxy_pass http://portfolio_api/api/portfolio;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # =====================================================================
        # API Proxy - Forward /api/* to Backend Service
        # =====================================================================
        location /api/ {
            proxy_pass http://backend_api/api/;
            proxy_http_version 1.1;

            # Headers for proper proxying
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # =====================================================================
        # WebSocket Proxy - Notifications (to Notification Service)
        # =====================================================================
        # This must come BEFORE the general /ws/ block
        location /ws/notifications {
            proxy_pass http://notification_api/ws/notifications;
            proxy_http_version 1.1;

            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket timeouts (longer for persistent connections)
            proxy_connect_timeout 60s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
        }

        # =====================================================================
        # WebSocket Proxy - Forward /ws/* to Backend Service
        # =====================================================================
        location /ws/ {
            proxy_pass http://backend_api/ws/;
            proxy_http_version 1.1;

            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket timeouts (longer for persistent connections)
            proxy_connect_timeout 60s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
        }

        # =====================================================================
        # Metrics Endpoint Proxy (for Prometheus)
        # =====================================================================
        location /metrics {
            proxy_pass http://backend_api/metrics;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # =====================================================================
        # Static Assets - Cache aggressively
        # =====================================================================
        # JavaScript and CSS (hashed filenames - cache forever)
        location /static/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Images, fonts, etc.
        location ~* \.(ico|gif|jpe?g|png|svg|woff2?|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # =====================================================================
        # React Router - Serve index.html for all other routes
        # =====================================================================
        # This enables client-side routing in React
        location / {
            try_files $uri $uri/ /index.html;

            # Don't cache index.html (so updates are immediate)
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # =====================================================================
        # Error Pages
        # =====================================================================
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
