# =============================================================================
# TheCreditWhisperers - Docker Compose Configuration (Microservices)
# =============================================================================
# Microservices architecture deployment with:
# - nginx frontend (React SPA + API proxy)
# - FastAPI backend (API only)
# - Notification service (WebSocket, alerts, real-time updates)
# - MongoDB database
# - Redis cache (with Pub/Sub for inter-service communication)
#
# This demonstrates true microservices separation for cloud-native architecture.
#
# Usage:
#   docker-compose up --build               # Start all services
#   docker-compose down                     # Stop all services
#   docker-compose down -v                  # Stop and remove volumes
#   docker-compose logs -f backend          # Follow backend logs
#   docker-compose logs -f notification     # Follow notification logs
#   docker-compose logs -f frontend         # Follow frontend logs

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Frontend Service (nginx + React SPA)
  # ---------------------------------------------------------------------------
  # Serves React static files and proxies API requests to backend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: creditwhisperers-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
      notification:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - creditwhisperers-network

  # ---------------------------------------------------------------------------
  # Backend Service (FastAPI API)
  # ---------------------------------------------------------------------------
  # Handles all API requests, WebSocket connections, and business logic
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: creditwhisperers-backend
    ports:
      - "8000:8000"
    environment:
      # Database
      - MONGO_URI=mongodb://mongodb:27017/creditwhisperers
      # Cache
      - REDIS_URL=redis://redis:6379/0
      # URLs (microservices architecture)
      - FRONTEND_URL=http://localhost:3000
      - API_BASE_URL=http://localhost:8000
      # Development settings
      - DEBUG=True
      - ENVIRONMENT=development
      # Cache TTLs (seconds)
      - PRICE_CACHE_TTL=300
      - NEWS_CACHE_TTL=600
      - SENTIMENT_CACHE_TTL=900
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - creditwhisperers-network

  # ---------------------------------------------------------------------------
  # Notification Service (WebSocket, Price Alerts, Real-time Updates)
  # ---------------------------------------------------------------------------
  # Dedicated microservice for all notification functionality
  notification:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: creditwhisperers-notification
    ports:
      - "8001:8001"
    environment:
      # Database
      - MONGO_URI=mongodb://mongodb:27017/creditwhisperers
      # Redis (for Pub/Sub)
      - REDIS_URL=redis://redis:6379/0
      # Service communication
      - BACKEND_URL=http://backend:8000
      # Development settings
      - DEBUG=True
      - ENVIRONMENT=development
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - creditwhisperers-network

  # ---------------------------------------------------------------------------
  # MongoDB Database
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: creditwhisperers-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - creditwhisperers-network

  # ---------------------------------------------------------------------------
  # Redis Cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: creditwhisperers-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - creditwhisperers-network

# -----------------------------------------------------------------------------
# Volumes (Persistent Data)
# -----------------------------------------------------------------------------
volumes:
  mongodb_data:
    name: creditwhisperers-mongodb-data
  redis_data:
    name: creditwhisperers-redis-data

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  creditwhisperers-network:
    name: creditwhisperers-network
    driver: bridge
