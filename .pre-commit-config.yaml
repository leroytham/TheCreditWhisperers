# =============================================================================
# TheCreditWhisperers - Pre-commit Hooks Configuration
# =============================================================================
# Enforces code quality checks before commits reach CI/CD
#
# Installation:
#   pip install pre-commit
#   pre-commit install
#
# Manual run:
#   pre-commit run --all-files
#
# Skip hooks (emergency only):
#   git commit --no-verify

repos:
  # =============================================================================
  # General Hooks
  # =============================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of files
      - id: check-yaml
        name: Check YAML syntax
        args: ['--unsafe']  # Allow custom tags
      - id: check-json
        name: Check JSON syntax
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: detect-private-key
        name: Detect private keys
      - id: check-case-conflict
        name: Check case conflicts

  # =============================================================================
  # Python Hooks
  # =============================================================================
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        name: Format Python code (Black)
        language_version: python3.12
        files: ^backend/

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: Sort Python imports (isort)
        args: ['--profile', 'black']
        files: ^backend/

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        name: Lint Python code (flake8)
        files: ^backend/
        args:
          - '--max-line-length=120'
          - '--extend-ignore=E203,E501,W503'

  # =============================================================================
  # JavaScript/TypeScript Hooks
  # =============================================================================
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.0.0
    hooks:
      - id: eslint
        name: Lint JavaScript/React code (ESLint)
        files: ^frontend/src/.*\.(js|jsx|ts|tsx)$
        types: [file]
        additional_dependencies:
          - eslint@8.57.0
          - eslint-plugin-react@7.34.0
          - eslint-plugin-react-hooks@4.6.0

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        name: Format JS/CSS/JSON (Prettier)
        files: ^frontend/src/.*\.(js|jsx|ts|tsx|css|json)$
        types: [file]

  # =============================================================================
  # Security Hooks
  # =============================================================================
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        name: Detect secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package-lock.json

  # =============================================================================
  # Terraform Hooks (if using IaC)
  # =============================================================================
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.88.0
    hooks:
      - id: terraform_fmt
        name: Format Terraform code
        files: ^terraform/
      - id: terraform_validate
        name: Validate Terraform
        files: ^terraform/

# =============================================================================
# CI Integration
# =============================================================================
# These hooks ensure code quality before it reaches GitHub Actions:
# - Black + isort: Consistent Python formatting
# - flake8: Python linting (matches CI config)
# - ESLint: JavaScript/React linting (matches CI config)
# - Security: Detects secrets and private keys
# - Terraform: Validates IaC before apply
