# =============================================================================
# TheCreditWhisperers - Market Data Service Kubernetes Deployment
# =============================================================================
# Defines the market data microservice deployment with:
# - Multiple replicas for high availability
# - Resource limits for proper scheduling
# - Health probes for self-healing
# - Environment variables from ConfigMap and Secret
#
# Usage: kubectl apply -f k8s/market-data-deployment.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: creditwhisperers-market-data
  namespace: creditwhisperers
  labels:
    app: creditwhisperers
    component: market-data
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: creditwhisperers
      component: market-data
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: creditwhisperers
        component: market-data
        version: v1
    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: market-data
          image: creditwhisperers/market-data:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8002
              protocol: TCP

          envFrom:
            - configMapRef:
                name: creditwhisperers-config
            - secretRef:
                name: creditwhisperers-secrets

          env:
            - name: REDIS_HOST
              value: "creditwhisperers-redis"
            - name: REDIS_PORT
              value: "6379"

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"

          livenessProbe:
            httpGet:
              path: /health/live
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          startupProbe:
            httpGet:
              path: /health/startup
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
            successThreshold: 1

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: false

      restartPolicy: Always
      dnsPolicy: ClusterFirst
