# =============================================================================
# TheCreditWhisperers - Portfolio Service Kubernetes Service
# =============================================================================
# Exposes the portfolio microservice as a network service.
#
# Usage: kubectl apply -f k8s/portfolio-service.yaml

apiVersion: v1
kind: Service
metadata:
  name: creditwhisperers-portfolio
  namespace: creditwhisperers
  labels:
    app: creditwhisperers
    component: portfolio
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8004
      protocol: TCP
  selector:
    app: creditwhisperers
    component: portfolio
