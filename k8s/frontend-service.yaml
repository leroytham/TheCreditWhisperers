# =============================================================================
# TheCreditWhisperers - Frontend Kubernetes Service
# =============================================================================
# Exposes the frontend deployment as a network service.
# ClusterIP type for internal cluster access (use with Ingress for external).
#
# Usage: kubectl apply -f k8s/frontend-service.yaml

apiVersion: v1
kind: Service
metadata:
  name: creditwhisperers-frontend
  namespace: creditwhisperers
  labels:
    app: creditwhisperers
    component: frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app: creditwhisperers
    component: frontend
