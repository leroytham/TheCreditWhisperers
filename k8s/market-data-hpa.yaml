# =============================================================================
# TheCreditWhisperers - Market Data Service Horizontal Pod Autoscaler
# =============================================================================
# Automatically scales the market data service based on resource utilization.
#
# Features:
# - Scales between 2-6 replicas
# - CPU target: 70% utilization
# - Memory target: 80% utilization
#
# Usage: kubectl apply -f k8s/market-data-hpa.yaml

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: creditwhisperers-market-data-hpa
  namespace: creditwhisperers
  labels:
    app: creditwhisperers
    component: market-data-autoscaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: creditwhisperers-market-data

  minReplicas: 2
  maxReplicas: 6

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
        - type: Percent
          value: 100
          periodSeconds: 60
      selectPolicy: Max

    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
      selectPolicy: Min
