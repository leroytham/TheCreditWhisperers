# =============================================================================
# TheCreditWhisperers - Kubernetes ConfigMap
# =============================================================================
# Non-sensitive configuration values for the application.
# These values are injected as environment variables into the pods.
#
# Usage: kubectl apply -f k8s/configmap.yaml

apiVersion: v1
kind: ConfigMap
metadata:
  name: creditwhisperers-config
  namespace: creditwhisperers
  labels:
    app: creditwhisperers
    component: config
data:
  # Application URLs
  FRONTEND_URL: "https://creditwhisperers.example.com"
  API_BASE_URL: "https://creditwhisperers.example.com"

  # Environment settings
  DEBUG: "False"
  ENVIRONMENT: "production"

  # Cache TTL settings (in seconds)
  PRICE_CACHE_TTL: "300"       # 5 minutes
  NEWS_CACHE_TTL: "600"        # 10 minutes
  SENTIMENT_CACHE_TTL: "900"   # 15 minutes
  COMPANY_INFO_CACHE_TTL: "86400"  # 24 hours
  SECTOR_CACHE_TTL: "3600"     # 1 hour

  # Server settings
  PORT: "8000"
  HOST: "0.0.0.0"
