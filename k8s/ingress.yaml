# =============================================================================
# TheCreditWhisperers - Kubernetes Ingress (Microservices)
# =============================================================================
# Provides external HTTP/HTTPS access to the microservices architecture.
# Routes traffic between frontend and backend services.
#
# Architecture (6-service microservices):
#   / (default)           → Frontend Service (nginx + React SPA)
#   /api/notifications/*  → Notification Service (Notifications API)
#   /api/price-alerts/*   → Notification Service (Price Alerts API)
#   /api/market/*         → Market Data Service (Stock prices, company info)
#   /api/sentiment/*      → Sentiment Service (News, sentiment analysis)
#   /api/portfolio/*      → Portfolio Service (Portfolio aggregation, timeseries)
#   /api/*                → Backend Service (FastAPI - fallback)
#   /ws/notifications/*   → Notification Service (WebSocket notifications)
#   /ws/*                 → Backend Service (WebSocket)
#   /metrics              → Backend Service (Prometheus metrics)
#   /health/*             → Backend Service (Health probes)
#
# Prerequisites:
# - Nginx Ingress Controller installed
#   (kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.8.2/deploy/static/provider/cloud/deploy.yaml)
# - cert-manager for automatic TLS certificates (optional)
#   (kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.13.0/cert-manager.yaml)
#
# Usage: kubectl apply -f k8s/ingress.yaml

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: creditwhisperers-ingress
  namespace: creditwhisperers
  labels:
    app: creditwhisperers
    component: ingress
  annotations:
    # Ingress class
    kubernetes.io/ingress.class: nginx

    # TLS with cert-manager (optional - comment out if not using cert-manager)
    cert-manager.io/cluster-issuer: letsencrypt-prod

    # Nginx-specific configurations
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"

    # WebSocket support
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$request_uri"

    # Rate limiting (optional)
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"

    # Use regex for path matching
    nginx.ingress.kubernetes.io/use-regex: "true"

spec:
  # TLS configuration
  tls:
    - hosts:
        - creditwhisperers.example.com
      secretName: creditwhisperers-tls

  # Routing rules - Microservices Architecture
  rules:
    - host: creditwhisperers.example.com
      http:
        paths:
          # =================================================================
          # Notification Service Routes (highest priority - most specific)
          # =================================================================

          # Notifications API → Notification Service
          - path: /api/notifications(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: creditwhisperers-notification
                port:
                  number: 80

          # Price Alerts API → Notification Service
          - path: /api/price-alerts(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: creditwhisperers-notification
                port:
                  number: 80

          # Notification WebSocket → Notification Service (with sticky sessions)
          - path: /ws/notifications(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: creditwhisperers-notification-ws
                port:
                  number: 80

          # =================================================================
          # Market Data Service Routes
          # =================================================================

          # Market Data API → Market Data Service
          - path: /api/market(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: creditwhisperers-market-data
                port:
                  number: 80

          # =================================================================
          # Sentiment Service Routes
          # =================================================================

          # Sentiment API → Sentiment Service
          - path: /api/sentiment(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: creditwhisperers-sentiment
                port:
                  number: 80

          # =================================================================
          # Portfolio Service Routes
          # =================================================================

          # Portfolio API → Portfolio Service
          - path: /api/portfolio(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: creditwhisperers-portfolio
                port:
                  number: 80

          # =================================================================
          # Backend API Routes (general - fallback)
          # =================================================================

          # API routes → Backend Service
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: creditwhisperers-backend
                port:
                  number: 80

          # WebSocket routes → Backend Service (with sticky sessions)
          - path: /ws(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: creditwhisperers-websocket
                port:
                  number: 80

          # Health check routes → Backend Service
          - path: /health(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: creditwhisperers-backend
                port:
                  number: 80

          # Prometheus metrics → Backend Service
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: creditwhisperers-backend
                port:
                  number: 80

          # =================================================================
          # Frontend Routes (catch-all - lowest priority)
          # =================================================================

          # All other routes → Frontend Service (React SPA)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: creditwhisperers-frontend
                port:
                  number: 80

---
