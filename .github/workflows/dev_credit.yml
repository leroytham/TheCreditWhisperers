name: Deploy Fullstack (React + FastAPI) to Azure Web App

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js for frontend build
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Step 3: Build the React frontend
      - name: Build React frontend
        env:
          CI: false
        run: |
          cd frontend
          npm ci
          npm run build

      # Step 4: Copy React build into backend static folder
      - name: Copy frontend build into backend
        run: |
          mkdir -p backend/app/static
          cp -r frontend/build/* backend/app/static/

      # 👇 Optional but recommended:
      # Verify the build files were copied successfully
      - name: Verify static folder contents
        run: |
          echo "Contents of backend/app/static:"
          ls -la backend/app/static || echo "Static folder missing"

      # Step 5: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      # Step 6: Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r ./backend/requirements.txt

      # Step 7: Login to Azure
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6E5A11DC635D4DDCB73922C6512F90D9 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C1F29871F55C49CFAC9874215D03FF26 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0783F7F4D4284F15A23ED9DAC79BAE70 }}

      # Step 8: Deploy to Azure Web App
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'credit'
          slot-name: 'Production'
          package: ./backend
          startup-command: >
            gunicorn -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000 app.main:app

      # =============================================================================
      # IMPORTANT: Azure App Service Environment Variables
      # =============================================================================
      # These must be configured in Azure Portal for production deployment:
      # Go to: Azure Portal > App Service "credit" > Configuration > Application settings
      #
      # REQUIRED ENVIRONMENT VARIABLES:
      #   - FRONTEND_URL: https://credit-gtfhduenc9h4a4bp.japanwest-01.azurewebsites.net
      #   - API_BASE_URL: https://credit-gtfhduenc9h4a4bp.japanwest-01.azurewebsites.net
      #   - AZURE_REDIRECT_URI: (leave blank to auto-generate, or set explicitly)
      #   - APPLICATION_ID: <your Azure AD app client ID>
      #   - DIRECTORY_ID: <your Azure AD tenant ID>
      #   - CLIENT_SECRET: <your Azure AD client secret>
      #   - MONGO_URI: <your MongoDB connection string>
      #
      # OPTIONAL ENVIRONMENT VARIABLES:
      #   - REDIS_URL: <your Redis connection string> (or leave empty to disable caching)
      #   - FINNHUB_API_TOKEN, ALPHA_VANTAGE_API_KEY, NEWS_API_KEY, MARKETAUX_API_KEY
      #
      # AZURE AD APP REGISTRATION:
      # Ensure your Azure AD app registration has the correct redirect URI configured:
      #   https://credit-gtfhduenc9h4a4bp.japanwest-01.azurewebsites.net/auth/callback
      #
      # NOTE: If AZURE_REDIRECT_URI is left blank, it will auto-generate as:
      #   {API_BASE_URL}/auth/callback
      # =============================================================================