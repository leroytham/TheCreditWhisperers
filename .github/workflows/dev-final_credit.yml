name: Deploy Fullstack (React + FastAPI) to Azure Web App

on:
  push:
    branches:
      - dev-final
  workflow_dispatch:

jobs:
  # Run backend tests before deployment
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        working-directory: ./backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          pytest tests/ -v --cov=app --cov-report=term-missing
          echo "✅ Backend tests passed!"

  # Run frontend tests before deployment
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: ./frontend
        run: |
          npm run test:ci
          echo "✅ Frontend tests passed!"

  # Deploy only if tests pass
  deploy:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]  # Only deploy if tests pass
    permissions:
      id-token: write
      contents: read

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js for frontend build
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Step 3: Build the React frontend
      - name: Build React frontend
        env:
          CI: false
        run: |
          cd frontend
          npm ci
          npm run build
      # Step 4: Copy React build into backend static folder
      - name: Copy frontend build into backend
        run: |
          mkdir -p backend/app/static
          cp -r frontend/build/* backend/app/static/
      # 👇 Optional but recommended:
      # Verify the build files were copied successfully
      - name: Verify static folder contents
        run: |
          echo "Contents of backend/app/static:"
          ls -la backend/app/static || echo "Static folder missing"
      # Step 5: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      # Step 6: Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r ./backend/requirements.txt
      # Step 7: Login to Azure
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_969F204618194EA598F59026F147C5D5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3B541864CB2D4B57904AE9FA9BCD3382 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C5570DB8048843EEA968E248170FBBBC }}

      # Step 8: Deploy to Azure Web App
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'credit'
          slot-name: 'Production'
          package: ./backend
          startup-command: >
            gunicorn -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000 app.main:app
      # IMPORTANT: Environment variables must be configured in Azure Portal
      # Go to: Azure Portal > App Service "credit" > Configuration > Application settings
      # Add the following environment variables:
      #   - API_BASE: https://credit-gtfhduenc9h4a4bp.japanwest-01.azurewebsites.net
      #   - FRONTEND_URL: https://credit-gtfhduenc9h4a4bp.japanwest-01.azurewebsites.net
      #   - AZURE_REDIRECT_URI: https://credit-gtfhduenc9h4a4bp.japanwest-01.azurewebsites.net/api/auth/callback
      #   - APPLICATION_ID: <your Azure app client ID>
      #   - DIRECTORY_ID: <your Azure tenant ID>
      #   - CLIENT_SECRET: <your Azure client secret>
      #   - MONGO_URI: <your MongoDB connection string>
      #   - REDIS_URL: <your Redis connection string> (or leave empty to disable caching)
      #   - FINNHUB_API_TOKEN, ALPHA_VANTAGE_API_KEY, NEWS_API_KEY, MARKETAUX_API_KEY (optional)
      #
      # Also ensure your Azure AD app registration has the correct redirect URI:
      #   https://credit-gtfhduenc9h4a4bp.japanwest-01.azurewebsites.net/api/auth/callback